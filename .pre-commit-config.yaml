repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: check-agents-md
        name: Check AGENTS.md line count
        entry: python3 scripts/hooks/check_agents_md.py
        language: python
        files: ^AGENTS\.md$
        pass_filenames: true
      - id: check-commit-msg
        name: Check Commit Message Prefix
        entry: python3 scripts/hooks/check_commit_msg.py
        language: python
        stages: [commit-msg]
