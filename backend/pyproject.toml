[project]
name = "grant-reviewer-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.118.0",
    "ipykernel>=7.2.0",
    "openai>=2.17.0",
    "psycopg[binary]>=3.2.10",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.32",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.15.0",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "app.repositories.review_repository",
    "main"
]
ignore_errors = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Stricter baseline: E/F (errors), I (isort), B (bugbear), SIM (simplify), UP (pyupgrade), W (warnings)
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Script intentionally mutates sys.path before app imports for CLI execution.
"scripts/run_review.py" = ["E402"]
"backend/app/db.py" = ["F401"] # init file often has unused imports

[tool.pytest.ini_options]
markers = [
    "no_db: test does not require a database connection",
]
