cases:
  - case_id: replay_persists_history
    surface: structured_api
    expected_http_status: 200
    expected_error_code: null
    expect_review_persisted: true
    expected_review_status: COMPLETED
    expected_summary_convention: completed_nonempty
    idempotency_key: idem-wf0043-replay-1
    request_nodes:
      - node_logical_id: academic_profile
        text: profile text for deterministic replay
  - case_id: validation_error_missing_idempotency_header
    surface: structured_api
    expected_http_status: 400
    expected_error_code: VALIDATION_ERROR
    expect_review_persisted: false
    expected_review_status: null
    expected_summary_convention: null
    idempotency_key: ""
    request_nodes:
      - node_logical_id: academic_profile
        text: payload without idempotency key
  - case_id: unknown_node_id
    surface: structured_api
    expected_http_status: 422
    expected_error_code: UNKNOWN_NODE_ID
    expect_review_persisted: false
    expected_review_status: null
    expected_summary_convention: null
    idempotency_key: idem-wf0043-unknown-node-1
    request_nodes:
      - node_logical_id: unknown_node
        text: unknown node payload
  - case_id: review_stage_node_mismatch
    surface: structured_api
    expected_http_status: 422
    expected_error_code: REVIEW_STAGE_NODE_MISMATCH
    expect_review_persisted: false
    expected_review_status: null
    expected_summary_convention: null
    idempotency_key: idem-wf0043-stage-mismatch-1
    request_nodes:
      - node_logical_id: academic_profile
        text: step mismatch payload
  - case_id: idempotency_payload_mismatch
    surface: structured_api
    expected_http_status: 409
    expected_error_code: IDEMPOTENCY_PAYLOAD_MISMATCH
    expect_review_persisted: true
    expected_review_status: null
    expected_summary_convention: null
    idempotency_key: idem-wf0043-payload-mismatch-1
    request_nodes:
      - node_logical_id: academic_profile
        text: changed payload for mismatch
  - case_id: post_persist_unresolvable_expectation_failed
    surface: structured_api
    expected_http_status: 200
    expected_error_code: null
    expect_review_persisted: true
    expected_review_status: FAILED
    expected_summary_convention: EXPECTATION_REF_UNRESOLVABLE
    idempotency_key: idem-wf0043-post-persist-failed-1
    request_nodes:
      - node_logical_id: academic_profile
        text: payload for deterministic failed review
  - case_id: policy_blocking
    surface: single_snippet_policy
    expected_http_status: 200
    expected_error_code: null
    expect_review_persisted: true
    expected_review_status: FAILED
    expected_summary_convention: POLICY_BLOCKING
    idempotency_key: ""
    request_nodes: []
    enforcement_mode: BLOCKING
    forbidden_term: insufficient budget
    feedback_text: The proposal has insufficient budget.
  - case_id: policy_post_check
    surface: single_snippet_policy
    expected_http_status: 200
    expected_error_code: null
    expect_review_persisted: true
    expected_review_status: COMPLETED
    expected_summary_convention: POST_CHECK_WARNING
    idempotency_key: ""
    request_nodes: []
    enforcement_mode: POST_CHECK
    forbidden_term: maybe
    feedback_text: This is maybe acceptable.
  - case_id: policy_prompt_only
    surface: single_snippet_policy
    expected_http_status: 200
    expected_error_code: null
    expect_review_persisted: true
    expected_review_status: COMPLETED
    expected_summary_convention: PROMPT_ONLY_NON_BLOCKING
    idempotency_key: ""
    request_nodes: []
    enforcement_mode: PROMPT_ONLY
    forbidden_term: insufficient budget
    feedback_text: The proposal has insufficient budget.
