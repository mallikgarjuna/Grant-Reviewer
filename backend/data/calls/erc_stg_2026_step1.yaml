funding_agency:
  id: erc
  name: European Research Council
  country: EU

funding_call:
  id: erc_stg_2026_step1
  code: ERC-2026-STG-STEP1
  title: ERC Starting Grant 2026 - Step 1
  year: 2026
  stage: step1
  language: en
  deadlines:
    step1_submission:
      datetime_local: "2026-10-15T17:00:00"
      timezone: "Europe/Brussels"

evaluation_criteria:
  - id: crit_excellence
    name: Excellence
    stage: step1
    weight_percent: 100
    evaluation_elements:
      - id: elem_groundbreaking_ambition
        name: Ground-breaking nature and ambition
        description: Assess novelty, ambition, and potential to advance the field.
        source_hint: "ERC StG 2026 Step 1 - Excellence"
        stage: STEP_1
      - id: elem_research_approach_feasibility
        name: Research approach and feasibility
        description: Assess coherence and feasibility of the proposed approach.
        source_hint: "ERC StG 2026 Step 1 - Excellence"
        stage: STEP_1
      - id: elem_pi_intellectual_capacity
        name: PI intellectual capacity and creativity
        description: Assess principal investigator potential for independent, frontier research.
        source_hint: "ERC StG 2026 Step 1 - Excellence"
        stage: STEP_1
      - id: elem_pi_track_record_evidence
        name: PI track record evidence
        description: Assess track record signals that support Step 1 excellence judgment.
        source_hint: "ERC StG 2026 Step 1 - Excellence"
        stage: STEP_1

proposal_nodes:
  - id: b1
    label: "Part B1"
    node_type: section
    source_section: "Part B1"
    guidance_text: "Step 1 evaluates Part B1. Keep content concise, evidence-based, and internally consistent."
    node_expectations:
      - evaluation_element_id: elem_groundbreaking_ambition
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_research_approach_feasibility
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_pi_intellectual_capacity
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_pi_track_record_evidence
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY

  - id: b1_extended_synopsis
    parent_logical_id: b1
    label: "Extended Synopsis"
    node_type: subsection
    source_section: "B1 Section 1"
    content_constraints:
      max_pages: 5
      note: "Step 1 extended synopsis page limit."
    guidance_text: "Describe high-risk/high-gain objectives, state of the art positioning, and a credible approach."
    compliance_rules:
      - id: comp_b1_synopsis_page_limit
        severity: WARNING
        rule_type: formatting
        description: "Extended Synopsis should not exceed 5 pages."
    node_expectations:
      - evaluation_element_id: elem_groundbreaking_ambition
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_research_approach_feasibility
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY

  - id: b1_cv
    parent_logical_id: b1
    label: "Curriculum Vitae"
    node_type: subsection
    source_section: "B1 Section 2a"
    content_constraints:
      max_pages: 2
      note: "CV page budget within Step 1 package."
    guidance_text: "Highlight independence trajectory, key appointments, and achievements relevant to frontier research."
    compliance_rules:
      - id: comp_b1_cv_page_limit
        severity: WARNING
        rule_type: formatting
        description: "Curriculum Vitae should not exceed 2 pages."
    node_expectations:
      - evaluation_element_id: elem_pi_intellectual_capacity
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_pi_track_record_evidence
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY

  - id: b1_track_record
    parent_logical_id: b1
    label: "Track Record"
    node_type: subsection
    source_section: "B1 Section 2b"
    content_constraints:
      max_pages: 2
      note: "Track record page budget within Step 1 package."
    guidance_text: "Provide concrete evidence of outputs, recognition, and leadership potential."
    compliance_rules:
      - id: comp_b1_track_record_page_limit
        severity: WARNING
        rule_type: formatting
        description: "Track Record should not exceed 2 pages."
    node_expectations:
      - evaluation_element_id: elem_pi_track_record_evidence
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_pi_intellectual_capacity
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY

runtime_notes:
  - id: note_step1_scope
    description: "Step 1 ingest scope includes Part B1 only; Step 2 routing is deferred to workflow execution logic."
