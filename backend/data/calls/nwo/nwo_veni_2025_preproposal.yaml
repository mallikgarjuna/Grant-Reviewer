# NWO Veni 2025 (pre-proposal) — source-grounded call definition
#
# Authored from official sources provided in-workflow.
# Traceability manifest: backend/data/calls/sources/nwo_veni_2025_preproposal.sources.md
#
# Primary sources:
# - veni_pre-proposal_form_2025.docx (proposal-node structure + constraints)
# - Call for Proposals Veni 2025_EN_0.pdf (DORA + assessment criterion)
#
funding_agency:
  id: nwo
  name: Dutch Research Council (NWO)
  country: NL

funding_call:
  id: nwo_talent_veni_2025_preproposal
  code: nwo_veni_2025_preproposal
  title: NWO Talent Programme — Veni 2025 — Pre-proposal
  year: 2025
  stage: preproposal
  language: en

  deadlines:
    preproposal_submission:
      datetime_local: "2025-09-02T14:00:00"
      timezone: "Europe/Amsterdam"
    fullproposal_submission:
      datetime_local: "2026-01-27T14:00:00"
      timezone: "Europe/Amsterdam"

  domain_notes:
    - domain_id: science_enw
      note: "ENW/Science pilot: pre-proposal research idea word limit expanded to 500 words (pilot does not affect assessment criteria)."

evaluation_criteria:
  - id: crit_quality_of_researcher
    name: Quality of the researcher
    stage: preproposal
    weight_percent: 100
    evaluation_elements:
      - id: elem_target_group_fit_and_growth
        name: Target-group fit and development leverage
        description: "Fit to the Veni target group (transition toward independence) and how Veni supports development."
        source_hint: "Call for Proposals (Veni 2025) §4.3.1"

      - id: elem_peer_exceeding_quality
        name: Researcher qualities exceed international peer norms
        description: "Qualities exceed customary international peer group norms, evidenced by CV, key output quality/impact, and academic achievements."
        source_hint: "Call for Proposals (Veni 2025) §4.3.1"

      - id: elem_positioning_in_themes
        name: Positioning in scientific and societal themes
        description: "Work is clearly positioned with respect to scientific and (where possible) societal themes or questions."
        source_hint: "Call for Proposals (Veni 2025) §4.3.1"

      - id: elem_network_collaboration_visibility
        name: Network, collaboration, and visibility
        description: "Quality of (inter)national network, collaborative abilities, and visibility."
        source_hint: "Call for Proposals (Veni 2025) §4.3.1"

      - id: elem_innovative_ideas_capability
        name: Capability to generate innovative ideas
        description: "CV demonstrates capability of generating innovative ideas."
        source_hint: "Call for Proposals (Veni 2025) §4.3.1"

      - id: elem_cv_idea_alignment
        name: CV and key output align with research idea
        description: "Key output and academic profile align with research idea, or applicant presents a convincing vision for achieving alignment."
        source_hint: "Call for Proposals (Veni 2025) §4.3.1 + pre-proposal form notes (section 3)"

proposal_nodes:
  - id: academic_profile
    label: Academic profile
    node_type: narrative
    source_section: "2a"
    content_constraints:
      total_word_limit:
        min_words: 400
        max_words: 700
        includes: ["all text"]
    guidance_text: >
      Evidence-based narrative of your unique academic profile (research line/agenda/vision, relevant qualities, skills, and activities).
      Substantiate quality claims; avoid output indicators and focus on achievements most relevant to your field and the research idea.
      Describe how the grant contributes to your academic development.
    compliance_rules:
      - id: comp_academic_profile_word_limit
        severity: ERROR
        rule_type: formatting
        description: "Academic profile must be between 400 and 700 words."
    node_expectations:
      - evaluation_element_id: elem_target_group_fit_and_growth
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
        guidance_note: "Make transition-to-independence stage explicit and explain how Veni supports development."
      - evaluation_element_id: elem_peer_exceeding_quality
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
        guidance_note: "Provide concrete evidence for exceeding peer norms; avoid bibliometric shortcuts."
      - evaluation_element_id: elem_positioning_in_themes
        expectation_strength: IMPORTANT
        evaluation_intent: STRATEGIC_FIT
        guidance_note: "State positioning relative to scientific (and where possible societal) themes/questions."
      - evaluation_element_id: elem_network_collaboration_visibility
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
        guidance_note: "Evidence for network, collaboration, and visibility."
      - evaluation_element_id: elem_innovative_ideas_capability
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
        guidance_note: "Evidence of innovative-ideas capability."

  - id: key_outputs
    label: Key outputs
    node_type: narrative
    source_section: "2b"
    content_constraints:
      max_items: 10
      total_word_limit:
        min_words: 400
        max_words: 700
        includes: ["all text"]
      note: "Official form notes mention exclusions (references/URLs/types/indicators), but runtime counting is deterministic whitespace tokenization over submitted text."
    guidance_text: >
      Provide up to 10 key output items that best demonstrate your qualities and are relevant to the application and research idea.
      Provide reference information and (at most) one direct hyperlink per output item (preferably a persistent identifier such as a DOI) when applicable.
      Avoid prohibited quality indicators and bibliometric shortcuts.
    compliance_rules:
      - id: comp_key_outputs_max_items
        severity: WARNING
        rule_type: hard_limit
        description: "List no more than 10 key output items (runtime does not deterministically parse items in plain text)."
      - id: comp_key_outputs_total_word_limit
        severity: ERROR
        rule_type: formatting
        description: "Key outputs narrative should be between 400 and 700 words."
    node_expectations:
      - evaluation_element_id: elem_peer_exceeding_quality
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
        guidance_note: "Use key outputs as concrete evidence supporting excellence beyond peers."
      - evaluation_element_id: elem_network_collaboration_visibility
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
        guidance_note: "Include credible signals of collaboration/visibility where relevant."
      - evaluation_element_id: elem_innovative_ideas_capability
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
        guidance_note: "Use outputs/achievements to support innovative-ideas capability."

  - id: research_idea
    label: Research idea
    node_type: narrative
    source_section: "3"
    content_constraints:
      word_limit_by_domain:
        default_max_words: 100
        science_enw_max_words: 500
      note: "Research idea is not assessed as an independent criterion in pre-proposal; used to assess alignment with CV/key outputs."
    guidance_text: >
      Concise description of the envisioned research topic and importance (not a full plan).
      Plain text only; do not include figures/tables/references/footnotes. Hyperlinks are not allowed in this section.
      Make alignment with academic profile and key outputs explicit (or explain how alignment will be achieved).
    compliance_rules:
      - id: comp_research_idea_word_limit
        severity: ERROR
        rule_type: formatting
        description: "Must respect domain-specific word limit (default 100; ENW/Science pilot 500)."
    node_expectations:
      - evaluation_element_id: elem_cv_idea_alignment
        expectation_strength: MANDATORY
        evaluation_intent: STRATEGIC_FIT
        guidance_note: "Use the research idea to evaluate CV/key-output alignment or a credible path to alignment."

reviewer_policy:
  - id: pol_no_bibliometrics_blocking
    applies_to_stage: BOTH
    rule_type: prohibited_metric
    instruction: "Do not use bibliometric indicators (e.g., h-index, Journal Impact Factor) as a basis for assessment; evaluate on merits per DORA."
    severity: ERROR
    enforcement_mode: BLOCKING
    forbidden_terms:
      - h-index
      - h index
      - journal impact factor
      - impact factor
      - JIF
      - SNIP
      - SJR
      - SCImago
      - Q1
      - university rankings
    source_hint: "Call for Proposals (Veni 2025) §4.1 + pre-proposal form notes (2a/2b)"

  - id: pol_no_ranked_journal_language
    applies_to_stage: BOTH
    rule_type: prohibited_metric
    instruction: "Avoid prestige/ranking language for venues (e.g., 'top-tier journal'); focus on evidence-based narrative."
    severity: WARNING
    enforcement_mode: POST_CHECK
    forbidden_terms:
      - top-tier
      - top tier
      - top journal
      - prestigious journal
      - leading journal
      - top publisher
      - prestigious publisher
      - leading publisher
    source_hint: "Pre-proposal form notes (2a/2b)"

  - id: pol_research_idea_not_independent_criterion
    applies_to_stage: BOTH
    applies_to_node_ids: ["research_idea"]
    rule_type: evaluation_scope
    instruction: "Research idea is not assessed as an independent criterion at pre-proposal stage; use it only to assess alignment with academic profile and key outputs."
    severity: WARNING
    enforcement_mode: PROMPT_ONLY
    source_hint: "Pre-proposal form notes (section 3) + Call for Proposals (Veni 2025) §4.3.1"

runtime_notes:
  - id: runtime_word_count_tokenization
    description: "Runtime word counting uses deterministic whitespace tokenization and does not implement exclusions (e.g., excluding references/URLs)."
