# ERC Consolidator Grant 2026 (full combined) — canonical v2 tracer-bullet definition
#
# Authored from official sources provided in-workflow.
# Traceability manifest: backend/data/calls/sources/erc_cog_2026_full.sources.md
#
# Primary sources:
# - af_he-erc-cog_en.pdf (proposal form structure and section guidance)
# - erc-rules-for-submission-and-evaluation_he-erc_en.pdf (evaluation criteria/elements + step scope)

funding_agency:
  id: erc
  name: European Research Council
  country: EU

funding_call:
  id: erc_cog_2026_full
  code: erc_cog_2026_full
  title: ERC Consolidator Grant 2026
  year: 2026
  stage: full
  language: en

evaluation_criteria:
  - id: crit_excellence
    name: Scientific Excellence
    stage: step1_step2
    weight_percent: 100
    evaluation_elements:
      - id: elem_groundbreaking
        name: Ground-breaking nature and ambition
        description: Originality and ambition of the research project and its potential to advance the frontier of knowledge.
        source_hint: "Work Programme 2026 - 1.6.5 Research Project"
        stage: BOTH
      - id: elem_pi_capacity
        name: PI intellectual capacity and creativity
        description: PI scientific expertise, creativity, and capacity to execute the proposed project.
        source_hint: "Work Programme 2026 - 1.6.5 Principal Investigator(s)"
        stage: BOTH
      - id: elem_state_of_knowledge
        name: Current state of knowledge
        description: Accuracy and quality of the state-of-the-art framing.
        source_hint: "Application Form - Part B1 Part I"
        stage: BOTH
      - id: elem_objectives
        name: Scientific question and objectives
        description: Clarity, coherence, and ambition of the scientific question and project objectives.
        source_hint: "Application Form - Part B1 Part I"
        stage: BOTH
      - id: elem_strategy
        name: Overall approach and research strategy
        description: Coherence of the overall approach and strategy to reach project goals.
        source_hint: "Application Form - Part B1 Part I"
        stage: BOTH
      - id: elem_methodology
        name: Research methodology
        description: Methodological appropriateness and feasibility for achieving objectives.
        source_hint: "Application Form - Part B2 Part II"
        stage: STEP_2
      - id: elem_work_plan
        name: Work plan
        description: Feasibility and coherence of tasks, timing, and dependencies.
        source_hint: "Application Form - Part B2 Part II"
        stage: STEP_2
      - id: elem_risks
        name: Risk assessment and mitigation
        description: Identification of key risks and credibility of mitigation measures.
        source_hint: "Application Form - Part B2 Part II"
        stage: STEP_2
      - id: elem_resources
        name: Resources and budget justification
        description: Adequacy and justification of requested resources, assessed at Step 2.
        source_hint: "Work Programme 2026 - 1.6.5 Research Project (Step 2)"
        stage: STEP_2

proposal_nodes:
  - id: b1
    label: Part B1
    node_type: section
    source_section: "AF 2026 - Part B1"
    guidance_text: Part B1 is evaluated at Step 1 and Step 2.
    node_expectations:
      - evaluation_element_id: elem_groundbreaking
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_pi_capacity
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY

  - id: b1_part1_state_of_knowledge
    parent_logical_id: b1
    label: Part I - Current state of knowledge
    node_type: subsection
    source_section: "AF 2026 - Part B1 Part I"
    guidance_text: Position the proposed project against the current state of knowledge.
    node_expectations:
      - evaluation_element_id: elem_state_of_knowledge
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_groundbreaking
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY

  - id: b1_part1_objectives
    parent_logical_id: b1
    label: Part I - Scientific question and objectives
    node_type: subsection
    source_section: "AF 2026 - Part B1 Part I"
    guidance_text: State the scientific question and project objectives.
    node_expectations:
      - evaluation_element_id: elem_objectives
        expectation_strength: MANDATORY
        evaluation_intent: COMPLIANCE
      - evaluation_element_id: elem_groundbreaking
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY

  - id: b1_part1_strategy
    parent_logical_id: b1
    label: Part I - Overall approach and research strategy
    node_type: subsection
    source_section: "AF 2026 - Part B1 Part I"
    guidance_text: Describe the overall strategy to deliver the project.
    node_expectations:
      - evaluation_element_id: elem_strategy
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_pi_capacity
        expectation_strength: IMPORTANT
        evaluation_intent: RISK

  - id: b1_cv_track_record
    parent_logical_id: b1
    label: Curriculum Vitae and Track Record
    node_type: subsection
    source_section: "AF 2026 - Part B1 CV/Track Record"
    guidance_text: Evidence of PI capacity and creativity to execute the project.
    node_expectations:
      - evaluation_element_id: elem_pi_capacity
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY

  - id: b2
    label: Part B2
    node_type: section
    source_section: "AF 2026 - Part B2"
    guidance_text: Part B2 is evaluated only at Step 2.
    compliance_rules:
      - id: comp_b2_step2_only
        severity: WARNING
        rule_type: stage_scope
        description: Part B2 content should be assessed only at Step 2.
    node_expectations:
      - evaluation_element_id: elem_methodology
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_work_plan
        expectation_strength: IMPORTANT
        evaluation_intent: QUALITY
      - evaluation_element_id: elem_risks
        expectation_strength: IMPORTANT
        evaluation_intent: RISK

  - id: b2_methodology
    parent_logical_id: b2
    label: Part II - Research methodology
    node_type: subsection
    source_section: "AF 2026 - Part B2 Part II"
    guidance_text: Explain methodology and implementation details.
    node_expectations:
      - evaluation_element_id: elem_methodology
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY

  - id: b2_work_plan
    parent_logical_id: b2
    label: Part II - Work plan
    node_type: subsection
    source_section: "AF 2026 - Part B2 Part II"
    guidance_text: Present work packages, timing, and dependencies.
    node_expectations:
      - evaluation_element_id: elem_work_plan
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY

  - id: b2_risks
    parent_logical_id: b2
    label: Part II - Risk assessment and mitigating measures
    node_type: subsection
    source_section: "AF 2026 - Part B2 Part II"
    guidance_text: Identify critical risks and realistic mitigation actions.
    node_expectations:
      - evaluation_element_id: elem_risks
        expectation_strength: MANDATORY
        evaluation_intent: RISK

  - id: resources_time_commitment
    label: Resources and budget justification
    node_type: section
    source_section: "Part A Section C + Work Programme 2026"
    guidance_text: Assess resources and budget only at Step 2.
    compliance_rules:
      - id: comp_resources_step2_only
        severity: WARNING
        rule_type: stage_scope
        description: Resource sufficiency should be assessed only at Step 2.
    node_expectations:
      - evaluation_element_id: elem_resources
        expectation_strength: MANDATORY
        evaluation_intent: QUALITY

reviewer_policy:
  - id: pol_excellence_only
    applies_to_stage: BOTH
    applies_to_node_ids: []
    rule_type: criterion_scope
    instruction: Assess only against Excellence criterion and mapped evaluation elements.
    severity: WARNING
    enforcement_mode: PROMPT_ONLY
    source_hint: "ERC Rules for Submission and Evaluation (Excellence-only criterion)"

runtime_notes:
  - id: note_step_scope
    description: Step 1 evaluates Part B1; Step 2 evaluates the full proposal including Part B2 and resources.
