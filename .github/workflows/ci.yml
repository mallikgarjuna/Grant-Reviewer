name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Install project
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Type Check (MyPy)
        run: uv run mypy .

      - name: Contract Boundary Governance Check
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            diff_range="origin/${{ github.base_ref }}...HEAD"
          else
            before_sha="${{ github.event.before }}"
            if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              diff_range="HEAD~1...HEAD"
            else
              diff_range="$before_sha...HEAD"
            fi
          fi
          git diff --name-only "$diff_range" > /tmp/wf0053_changed_paths.txt
          cat /tmp/wf0053_changed_paths.txt
          uv run python scripts/check_contract_boundary_governance.py \
            --changed-path-file /tmp/wf0053_changed_paths.txt

      - name: WF-0053 Negative Smoke (Expected Fail-Closed)
        if: github.event_name == 'pull_request'
        run: |
          set +e
          output=$(uv run python scripts/check_contract_boundary_governance.py \
            --changed-path backend/app/engine/contracts.py \
            --evidence-bundle contract_gate_evidence \
            --evidence-bundle artifact_traceability_evidence 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected governance checker failure for negative smoke, but got success."
            exit 1
          fi
          echo "$output" | grep -q "reason_code=MISSING_REQUIRED_EVIDENCE_BUNDLES"
          echo "$output" | grep -q "negative_smoke_evidence"

      - name: WF-0054 CI Policy Regression Sweep
        run: uv run pytest tests/scripts/test_ci_policy_event_scope.py -k "wf0054_ci_policy_"

      - name: Contract Gate (Marker)
        run: uv run pytest tests/engine/test_review_request_contracts.py -m contract_gate --strict-markers -q
        env:
          LLM_MODE: stub
          DATABASE_URL: "sqlite:///./ci_test.db"

      - name: Test (Pytest no_db)
        run: uv run pytest -m no_db
        env:
          LLM_MODE: stub # Ensure tests run without OpenAI key
          DATABASE_URL: "sqlite:///./ci_test.db" # File-backed SQLite avoids per-connection in-memory table loss

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
