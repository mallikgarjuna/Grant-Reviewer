name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Install project
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Type Check (MyPy)
        run: uv run mypy .

      - name: Test (Pytest)
        run: uv run pytest
        env:
          LLM_MODE: stub # Ensure tests run without OpenAI key
          DATABASE_URL: "sqlite:///./ci_test.db" # File-backed SQLite avoids per-connection in-memory table loss

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
